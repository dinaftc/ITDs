# name -> OpenAI-compatible endpoint. ${VARS} are read from the environment / .env.
# Both task solvers run at temperature 0.1.
deepseek-v3.2:
  model: deepseek-chat
  base_url: ${DEEPSEEK_BASE_URL}
  api_key: ${DEEPSEEK_API_KEY}
  temperature: 0.1
qwen2.5-72b:
  model: Qwen/Qwen2.5-72B-Instruct
  base_url: ${QWEN_BASE_URL}
  api_key: ${QWEN_API_KEY}
  temperature: 0.1
qwen2.5-7b:
  model: Qwen/Qwen2.5-7B-Instruct
  base_url: ${QWEN_BASE_URL}
  api_key: ${QWEN_API_KEY}
  temperature: 0.1
